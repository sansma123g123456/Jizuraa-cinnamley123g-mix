name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build static bundle
        run: node tools/build_pages.mjs

      - name: Verify the minified bundle boots
        run: node tools/verify_minified.mjs

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          # `.cjs` on purpose: the repo is `"type": "module"`, so a plain
          # `lighthouserc.js` is parsed as ESM and `module.exports` blows up
          # with "Unexpected token ']'" inside the action.
          configPath: './lighthouserc.cjs'
          uploadArtifacts: true
          temporaryPublicStorage: true
