name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: false

# The deploy only runs on the main branch and only when the secrets are
# configured. Without them the job exits cleanly so a fork (or a user who
# does not use Cloudflare) is not blocked by a failing workflow.
jobs:
  deploy:
    name: Publish to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # terser is a devDependency and the minifier needs it. Without this
        # step the build silently falls back to the verbatim 3.2 MB bundle.
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build Cloudflare distribution
        run: node tools/build_cloudflare.mjs

      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured - skipping the Cloudflare deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # `cloudflare/pages-action` does not exist any more (the repo 404s), so
      # the deploy goes through `wrangler-action`, which drives the Wrangler
      # CLI directly. `command` is a Wrangler command line, not a file path.
      - name: Deploy to Cloudflare Pages
        id: deploy
        # Only the main branch is published - a pull request must not push a
        # deployment over the live site.
        if: github.event_name != 'pull_request' && steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare_dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'jizura-cin-mix' }} --branch=main

      - name: Summary
        run: |
          if [ "${{ steps.creds.outputs.ready }}" = "true" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Deployed to Cloudflare Pages: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.creds.outputs.ready }}" = "true" ]; then
            echo "Cloudflare build OK - deploy skipped (pull request)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Cloudflare deploy skipped (no credentials configured)." >> "$GITHUB_STEP_SUMMARY"
          fi
